body{font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans Thai",sans-serif}.card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1rem}.field{width:100%;border:1px solid #cbd5e1;border-radius:.65rem;padding:.68rem;background:#fff}.label{display:block;font-size:.8rem;font-weight:600;color:#475569;margin-bottom:.3rem}.btn{border-radius:.65rem;padding:.65rem 1rem;font-weight:700}.btn-primary{background:#0f766e;color:#fff}.btn-secondary{background:#e2e8f0;color:#334155}.badge{border-radius:999px;padding:.2rem .6rem;font-size:.75rem;font-weight:700}.status-ขอใบเสนอราคา{background:#dbeafe;color:#1d4ed8}.status-ต้องเข้าสำรวจหน้างาน{background:#fef3c7;color:#92400e}.status-เข้าสำรวจหน้างานแล้ว{background:#e0e7ff;color:#4338ca}.status-ระหว่างจัดทำใบเสนอราคา{background:#f3e8ff;color:#7e22ce}.status-ส่งใบเสนอราคาแล้ว{background:#cffafe;color:#0e7490}.status-อนุมัติ-ได้งาน{background:#dcfce7;color:#15803d}.status-ไม่ได้งาน{background:#fee2e2;color:#b91c1c}.status-ไม่เสนอราคา{background:#f1f5f9;color:#475569}.status-ยกเลิก{background:#e2e8f0;color:#334155;text-decoration:line-through}.modal{background:rgba(15,23,42,.5)}.timeline:before{content:"";position:absolute;left:.6rem;top:1rem;bottom:1rem;border-left:2px solid #cbd5e1}

  <script>
    window.onerror = function(msg, url, line, col, err) {
      var el = document.getElementById('app');
      if (el) {
        el.innerHTML = '<div style="background:#fee2e2;color:#b91c1c;padding:24px;margin:20px;border-radius:12px;font-family:sans-serif;border:1px solid #f87171;"><h2 style="font-size:18px;font-weight:bold;margin-bottom:8px;">⚠️ เกิดข้อผิดพลาดในหน้าเว็บ</h2><p><b>' + msg + '</b></p><p style="font-size:13px;margin-top:4px;">บรรทัด: ' + line + ':' + col + '</p><pre style="margin-top:12px;white-space:pre-wrap;font-size:12px;background:#fff;padding:10px;border-radius:6px;border:1px solid #fca5a5;">' + (err && err.stack ? err.stack : '') + '</pre></div>';
      }
    };
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('app');
      if (el) {
        el.innerHTML = '<div style="background:#fee2e2;color:#b91c1c;padding:24px;margin:20px;border-radius:12px;font-family:sans-serif;border:1px solid #f87171;"><h2 style="font-size:18px;font-weight:bold;margin-bottom:8px;">⚠️ เกิดข้อผิดพลาด</h2><p>' + (e.reason ? (e.reason.message || e.reason) : e) + '</p></div>';
      }
    });
  </script>

// ถ้าย้าย deployment ใหม่ ให้แก้บรรทัดนี้บรรทัดเดียว
const API_URL='https://script.google.com/macros/s/AKfycbwKK1DJqGRX9czppOSWNZiDn7uWSP5-BwOdcYBSf1XfDef1lPmKJ7UhcTZnbo_ClYt7/exec';

// เปิดจาก Apps Script โดยตรง = ใช้ google.script.run
// เปิดจาก GitHub Pages หรือที่อื่น = ยิง POST ไปที่ API_URL
const INSIDE_GAS=(typeof google!=="undefined"&&google.script&&google.script.run);
function srv(payload){
  if(INSIDE_GAS){
    return new Promise(resolve=>{
      const r=google.script.run.withSuccessHandler(x=>resolve(x)).withFailureHandler(e=>resolve({success:false,message:(e&&e.message)||"Server Error"}));
      if(payload.action==="signIn")r.signIn(payload.pin);
      else r.apiCall(payload.name,payload.session,payload.args);
    });
  }
  return fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(payload),
    redirect:"follow"
  }).then(r=>r.json()).catch(e=>({success:false,message:"ติดต่อเซิร์ฟเวอร์ไม่ได้: "+e.message}));
}

const SESSION={pin:'',userId:''};
function loadSession(){try{const s=JSON.parse(localStorage.getItem("pts_session")||"{}");SESSION.pin=s.pin||"";SESSION.userId=s.userId||""}catch(e){}}
function saveSession(){try{localStorage.setItem("pts_session",JSON.stringify(SESSION))}catch(e){}}
function clearSession(){SESSION.pin="";SESSION.userId="";try{localStorage.removeItem("pts_session")}catch(e){}}
function call(name,...args){
  const t=new Promise(resolve=>setTimeout(()=>resolve({success:false,message:"เชื่อมต่อไม่สำเร็จ (หมดเวลา) กรุณาลองใหม่"}),90000));
  return Promise.race([
    srv({name:name,session:{pin:SESSION.pin,userId:SESSION.userId},args:args})
      .then(r=>r&&typeof r==="object"?r:{success:false,message:"คำตอบจากเซิร์ฟเวอร์ผิดรูปแบบ"}),
    t
  ]);
}

function pinScreen(msg){
  $("#nav").innerHTML="";
  $("#app").innerHTML=`<section class="mx-auto max-w-sm p-6"><div class="card mt-10 text-center">
    <img src="${APP_LOGO}" alt="" class="mx-auto mb-3 h-14 w-14 rounded-xl object-contain">
    <h1 class="text-lg font-bold">PTS Sales</h1>
    <p class="mt-1 text-sm text-slate-500">ใส่รหัสเข้าใช้งาน 6 หลัก</p>
    <input id="pinBox" type="tel" inputmode="numeric" maxlength="6" autocomplete="off"
      class="field mt-4 text-center text-2xl tracking-[0.5em]" placeholder="------">
    <p id="pinMsg" class="mt-2 h-5 text-sm text-rose-600">${msg?esc(msg):""}</p>
    <button id="pinBtn" class="btn btn-primary mt-2 w-full">เข้าสู่ระบบ</button>
  </div></section>`;
  const box=$("#pinBox"),btn=$("#pinBtn");
  box.focus();
  box.addEventListener("keydown",e=>{if(e.key==="Enter")btn.click()});
  btn.onclick=async()=>{
    const pin=box.value.trim();
    if(pin.length<4){$("#pinMsg").textContent="กรุณาใส่รหัสให้ครบ";return}
    btn.disabled=true;btn.textContent="กำลังตรวจสอบ…";
    const r=await srv({action:"signIn",pin:pin});
    btn.disabled=false;btn.textContent="เข้าสู่ระบบ";
    if(!r||!r.success){$("#pinMsg").textContent=(r&&r.message)||"รหัสไม่ถูกต้อง";box.select();return}
    SESSION.pin=pin;
    pickUser(r.data.users);
  };
}
function pickUser(users){
  $("#app").innerHTML=`<section class="mx-auto max-w-sm p-6"><div class="card mt-10">

    <p class="mt-1 text-sm text-slate-500">เลือกชื่อของคุณเพื่อบันทึกว่าใครเป็นคนทำงาน</p>
    <div class="mt-4 space-y-2">${users.map(u=>`<button class="card w-full text-left" onclick="chooseUser(&quot;${esc(u.User_ID)}&quot;)">
      <b>${esc(u.Name||u.Email)}</b><p class="text-sm text-slate-600">${esc(u.Email)} · ${esc(u.Role)}</p></button>`).join("")}</div>
  </div></section>`;
}
async function chooseUser(id){SESSION.userId=id;saveSession();await start()}
function signOut(){clearSession();pinScreen("ออกจากระบบแล้ว")}
async function start(){
  loadSession();
  if(!SESSION.pin||!SESSION.userId)return pinScreen("");
  $("#app").innerHTML=`<div class="p-6 text-center text-slate-500">กำลังเข้าสู่ระบบ…</div>`;
  const r=await call("getInitialData");
  if(!r.success){clearSession();return pinScreen(r.message)}
  Object.assign(state,r.data);
  route('dashboard');
}
async function loadCustomers(){const r=await call('listCustomers','');if(r.success)state.customers=r.data}
async function loadUsers(){const r=await call('listUsers');if(r.success)state.users=r.data}
function route(name){if(name==='dashboard')dashboard();if(name==='opportunities')opportunities({owner:state.mine?myName():''});if(name==='rfq')rfqForm();if(name==='customers')customers();if(name==='users')usersPage();if(name==='report')reportPage()}
const renderTop=(title,sub='')=>`<header class="flex items-center justify-between bg-teal-800 px-4 py-3 text-white shadow"><div class="flex items-center gap-3">${APP_LOGO?`<img src="${APP_LOGO}" alt="Logo" class="h-10 w-10 rounded-lg object-contain bg-white p-0.5 shadow-sm">`:''}<div><h1 class="text-lg font-bold leading-tight">${title}</h1>${sub?`<p class="text-xs text-teal-100">${sub}</p>`:''}</div></div><span class="text-xs bg-teal-900/60 px-2.5 py-1 rounded-full border border-teal-700">${esc(state.user?.Name||state.user?.Email||'')}</span></header>`;
function cardOpp(o){return `<button onclick="detail('${esc(o.Opportunity_ID)}')" class="card w-full text-left"><div class="flex justify-between gap-2"><strong>${esc(o.Project_Name)}</strong><span class="badge ${statusClass(o.Status)}">${esc(o.Status)}</span></div><div class="mt-1 text-sm text-slate-600">${esc(o.Customer?.Company_Name||'')} · ${esc(o.Opportunity_ID)}</div><div class="mt-2 text-xs text-slate-500">ผู้รับผิดชอบ ${esc(o.Owner)} · ติดตาม ${date(o.Next_Action_Date)} · ครบกำหนด ${date(o.Due_Date)}</div></button>`}
async function dashboard(){loading();nav('dashboard');const owner=state.mine?myName():'';const r=await call('dashboardData',owner);if(!r.success)return toast(r.message);const d=r.data;$('#app').innerHTML=renderTop('PTS Sales','ภาพรวมงานขาย')+`<section class="space-y-5 p-4"><div class="flex gap-2"><button onclick="setScope(true)" class="btn flex-1 ${state.mine?'btn-primary':'btn-secondary'}">งานของฉัน</button><button onclick="setScope(false)" class="btn flex-1 ${state.mine?'btn-secondary':'btn-primary'}">ทั้งทีม</button></div><div class="grid grid-cols-2 gap-3 sm:grid-cols-3">${Object.entries(d.counts).map(([k,v])=>`<button onclick="opportunities({status:'${esc(k)}',owner:'${esc(owner)}'})" class="card text-left"><div class="text-2xl font-bold text-teal-700">${v}</div><div class="mt-1 text-xs text-slate-600">${esc(k)}</div></button>`).join('')}</div><button onclick="route('report')" class="btn btn-secondary w-full">รายงานสรุป & อัตราการปิดงาน</button>${workList('เลยวันติดตาม',d.followUpOverdue||[],'ไม่มีงานค้างติดตาม',true)}${workList('งานที่ต้องทำวันนี้',d.today,'ไม่มีงานติดตามวันนี้')}${workList('งานเกินกำหนดส่ง',d.overdue,'ไม่มีงานเกินกำหนด')}</section>`}
function setScope(mine){state.mine=mine;dashboard()}
function workList(title,items,empty,danger){return `<section><h2 class="mb-2 flex items-center gap-2 font-bold ${danger&&items.length?'text-rose-600':''}">${title}${items.length?`<span class="badge ${danger?'bg-rose-100 text-rose-700':'bg-slate-200 text-slate-600'}">${items.length}</span>`:''}</h2><div class="space-y-2">${items.length?items.map(cardOpp).join(''):`<div class="card text-sm text-slate-500">${empty}</div>`}</div></section>`}
async function opportunities(filter={}){loading();nav('opportunities');const r=await call('listOpportunities',filter);if(!r.success)return toast(r.message);renderOppList(r.data,filter)}
function renderOppList(rows,filter){$('#app').innerHTML=renderTop('งานขาย',`${rows.length} รายการ`)+`<section class="space-y-3 p-4"><div class="flex gap-2"><input id="search" value="${esc(filter.query||'')}" class="field" placeholder="ค้นหา งาน / บริษัท / โทร / QT" onkeydown="if(event.key==='Enter'){event.preventDefault();searchOpp()}"><button class="btn btn-primary" onclick="searchOpp()">ค้นหา</button></div><div class="grid grid-cols-3 gap-2"><select id="fstatus" class="field text-xs"><option value="">ทุกสถานะ</option>${state.statuses.map(s=>`<option ${filter.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select><select id="fowner" class="field text-xs"><option value="">ทุกผู้รับผิดชอบ</option>${owners().map(s=>`<option ${filter.owner===s?'selected':''}>${esc(s)}</option>`).join('')}</select><select id="fpriority" class="field text-xs"><option value="">ทุกความสำคัญ</option>${state.priorities.map(s=>`<option ${filter.priority===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="space-y-2">${rows.length?rows.map(cardOpp).join(''):'<div class="card text-center text-slate-500">ไม่พบงานขาย</div>'}</div></section>`}
function searchOpp(){opportunities({query:$('#search').value,status:$('#fstatus').value,owner:$('#fowner').value,priority:$('#fpriority').value})}
function owners(){return [...new Set(state.users.map(x=>x.Name||x.Email).filter(Boolean))]}
function customerOptions(selected=''){return `<option value="">เลือกลูกค้า</option>${state.customers.map(c=>`<option value="${esc(c.Customer_ID)}" ${selected===c.Customer_ID?'selected':''}>${esc(c.Company_Name)}${c.Contact_Name?' — '+esc(c.Contact_Name):''}</option>`).join('')}`}
function select(name,label,options,value='',required=false){return `<label><span class="label">${label}${required?' *':''}</span><select name="${name}" class="field" ${required?'required':''}>${options.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
function rfqForm(o={}){nav('rfq');const workTypes=state.master.filter(x=>x.Type==='Work_Type').map(x=>x.Name);$('#app').innerHTML=renderTop(o.Opportunity_ID?'แก้ไขงานขาย':'+ ขอใบเสนอราคา')+`<form class="space-y-4 p-4" onsubmit="saveOpp(event,'${esc(o.Opportunity_ID||'')}')"><div class="card space-y-3"><h2 class="font-bold">ข้อมูลหลัก</h2><label><span class="label">ลูกค้า *</span><select name="Customer_ID" class="field" required>${customerOptions(o.Customer_ID)}</select></label>${input('Project_Name','ชื่อโครงการ',o.Project_Name,'text',true)}${input('Site_Location','สถานที่หน้างาน',o.Site_Location)}${select('Work_Type','ประเภทงาน',[''].concat(workTypes),o.Work_Type)}<label><span class="label">รายละเอียด</span><textarea name="Description" class="field" rows="3">${esc(o.Description)}</textarea></label></div><div class="card grid grid-cols-1 gap-3 sm:grid-cols-2">${select('Priority','ความสำคัญ',state.priorities,o.Priority||'Normal')}${input('Due_Date','ครบกำหนด',''+(o.Due_Date||''),'date')}${select('Owner','ผู้รับผิดชอบ',[''].concat(owners()),o.Owner,true)}${input('Estimated_Value','มูลค่าคาดการณ์',o.Estimated_Value,'number')} ${input('Quotation_No','เลขที่ใบเสนอราคา',o.Quotation_No)}${input('Quotation_Amount','มูลค่าใบเสนอราคา',o.Quotation_Amount,'number')}</div><div class="card space-y-3"><h2 class="font-bold">ติดตามงาน</h2>${input('Next_Action','Next Action',o.Next_Action,'text',true)}${input('Next_Action_Date','วันที่ติดตาม',o.Next_Action_Date,'date',true)}<label><span class="label">หมายเหตุ</span><textarea name="Remark" class="field" rows="2">${esc(o.Remark)}</textarea></label></div><button class="btn btn-primary w-full">บันทึก</button></form>`}
async function saveOpp(e,id){e.preventDefault();lockForm(e,true);const raw=Object.fromEntries(new FormData(e.target));if(id)raw.Opportunity_ID=id;const r=await call('saveOpportunity',raw);if(!r.success){lockForm(e,false);return toast(r.message)}toast(r.message,true);detail(r.data.Opportunity_ID||id)}
async function detail(id){loading();nav('opportunities');const r=await call('getOpportunity',id);if(!r.success)return toast(r.message);const d=r.data,o=d.opportunity,c=d.customer;$('#app').innerHTML=renderTop(o.Opportunity_ID,'รายละเอียดงานขาย')+`<section class="space-y-4 p-4"><div class="card"><div class="flex justify-between gap-3"><div><h2 class="text-lg font-bold">${esc(o.Project_Name)}</h2><p class="text-sm text-slate-600">${esc(c.Company_Name)}</p></div><span class="badge ${statusClass(o.Status)}">${esc(o.Status)}</span></div><div class="mt-4 grid grid-cols-2 gap-2 text-sm"><p><b>ผู้ขอราคา:</b> ${esc(o.Requester_Name||c.Contact_Name||'-')}</p><p><b>แผนก:</b> ${esc(o.Requester_Department||c.Department||'-')}</p><p><b>โทร:</b> ${esc(o.Requester_Phone||c.Phone||'-')}</p><p><b>ผู้รับผิดชอบ:</b> ${esc(o.Owner)}</p><p><b>ครบกำหนด:</b> ${date(o.Due_Date)}</p><p><b>Next Action:</b> ${esc(o.Next_Action||'-')}</p></div>${canEditOpp(o)?`<div class="mt-4 grid grid-cols-2 gap-2"><button class="btn btn-secondary" onclick="editOpp('${esc(o.Opportunity_ID)}')">แก้ไข</button><button class="btn btn-primary" onclick="statusForm('${esc(o.Opportunity_ID)}','${esc(o.Status)}')">เปลี่ยนสถานะ</button>${o.Status!==voidStatus()?`<button class="btn col-span-2 bg-rose-50 text-rose-700" onclick="voidForm('${esc(o.Opportunity_ID)}')">ยกเลิกงาน</button>`:''}</div>`:`<p class="mt-4 rounded-lg bg-slate-100 p-3 text-xs text-slate-600">ดูอย่างเดียว — แก้ไขได้เฉพาะผู้รับผิดชอบ (${esc(o.Owner)}) หรือผู้ดูแลระบบ · คุณยังเพิ่ม Activity และแนบไฟล์ได้ตามปกติ</p>`}</div><div class="card text-sm"><p><b>สถานที่:</b> ${esc(o.Site_Location||'-')}</p><p class="mt-2"><b>รายละเอียด:</b> ${esc(o.Description||'-')}</p><p class="mt-2"><b>ใบเสนอราคา:</b> ${esc(o.Quotation_No||'-')} / ${esc(o.Quotation_Amount||'-')}</p></div><div class="grid grid-cols-2 gap-2"><button class="btn btn-secondary" onclick="activityForm('${esc(o.Opportunity_ID)}')">+ Activity</button><button class="btn btn-secondary" onclick="uploadForm('${esc(o.Opportunity_ID)}')">แนบไฟล์</button></div>${timeline(d.activities)}${attachments(d.attachments)}</section>`}
async function editOpp(id){const r=await call('getOpportunity',id);if(r.success)rfqForm(r.data.opportunity);else toast(r.message)}
function timeline(items){return `<section><h2 class="mb-2 font-bold">Timeline</h2><div class="space-y-2">${items.length?items.map(a=>`<div class="card"><div class="flex justify-between gap-2"><b>${esc(a.Activity_Type)}</b><span class="text-xs text-slate-500">${dt(a.Activity_Date)}</span></div><p class="mt-1 text-sm">${esc(a.Description)}</p></div>`).join(''):'<div class="card text-sm text-slate-500">ยังไม่มีกิจกรรม</div>'}</div></section>`}
function attachments(items){return `<section><h2 class="mb-2 font-bold">ไฟล์แนบ</h2><div class="space-y-2">${items.length?items.map(a=>`<div class="card flex items-center gap-2 text-sm"><a target="_blank" rel="noopener" href="${esc(a.Drive_URL)}" class="flex min-w-0 flex-1 justify-between gap-2"><span class="truncate">${esc(a.File_Name)}</span><span class="shrink-0 text-slate-500">${esc(a.Category)} ↗</span></a>${canManageFile(a)?`<button title="ลบไฟล์" onclick="removeFile('${esc(a.Attachment_ID)}','${esc(a.Opportunity_ID)}')" class="shrink-0 px-2 text-rose-600">✕</button>`:''}</div>`).join(''):'<div class="card text-sm text-slate-500">ยังไม่มีไฟล์แนบ</div>'}</div></section>`}
function modal(html){document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal fixed inset-0 z-40 flex items-end justify-center p-3 sm:items-center"><div class="max-h-[92vh] w-full max-w-lg overflow-auto rounded-2xl bg-white p-5">${html}</div></div>`)}function closeModal(){$('#modal')?.remove()}
function statusForm(id,current){const reasons=state.master.filter(x=>x.Type==='Close_Reason').map(x=>x.Name);modal(`<form class="space-y-3" onsubmit="submitStatus(event,'${esc(id)}')"><div class="flex justify-between"><h2 class="text-lg font-bold">เปลี่ยนสถานะ</h2><button type="button" onclick="closeModal()">✕</button></div>${select('Status','สถานะ',state.statuses,current,true)}${input('Quotation_Amount','Winning Amount','', 'number')}<label><span class="label">เหตุผลปิดงาน</span><select name="Close_Reason" class="field"><option value="">เลือกเหตุผล</option>${reasons.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label><span class="label">หมายเหตุ</span><textarea name="Remark" class="field"></textarea></label><button class="btn btn-primary w-full">ยืนยัน</button></form>`)}
async function submitStatus(e,id){e.preventDefault();lockForm(e,true);const r=await call('changeStatus',Object.assign({Opportunity_ID:id},Object.fromEntries(new FormData(e.target))));if(!r.success){lockForm(e,false);return toast(r.message)}closeModal();toast(r.message,true);detail(id)}
function activityForm(id){modal(`<form class="space-y-3" onsubmit="submitActivity(event,'${esc(id)}')"><div class="flex justify-between"><h2 class="text-lg font-bold">เพิ่ม Activity</h2><button type="button" onclick="closeModal()">✕</button></div>${select('Activity_Type','ประเภท',state.activityTypes,'Note',true)}<label><span class="label">รายละเอียด *</span><textarea name="Description" required class="field" rows="3"></textarea></label>${input('Activity_Date','วันที่/เวลา',nowLocal(),'datetime-local')}${input('Next_Action','Next Action')}${input('Next_Action_Date','วันติดตาม','', 'date')}<button class="btn btn-primary w-full">บันทึก</button></form>`)}
async function submitActivity(e,id){e.preventDefault();lockForm(e,true);const r=await call('addActivity',Object.assign({Opportunity_ID:id},Object.fromEntries(new FormData(e.target))));if(!r.success){lockForm(e,false);return toast(r.message)}closeModal();toast(r.message,true);detail(id)}
function uploadForm(id){modal(`<form class="space-y-3" onsubmit="submitFiles(event,'${esc(id)}')"><div class="flex justify-between"><h2 class="text-lg font-bold">แนบไฟล์</h2><button type="button" onclick="closeModal()">✕</button></div>${select('Category','ประเภทไฟล์',state.categories,'RFQ',true)}<label><span class="label">เลือกไฟล์ (ไฟล์ละไม่เกิน 10 MB)</span><input name="files" type="file" multiple class="field"></label><label><span class="label">หรือถ่ายรูปหน้างาน</span><input name="photos" type="file" accept="image/*" capture="environment" multiple class="field"></label><button class="btn btn-primary w-full">อัปโหลด</button></form>`)}
async function submitFiles(e,id){e.preventDefault();const f=[...e.target.files.files,...e.target.photos.files];if(!f.length)return toast('กรุณาเลือกไฟล์หรือถ่ายรูปอย่างน้อย 1 ไฟล์');if(f.length>10)return toast('อัปโหลดได้ครั้งละไม่เกิน 10 ไฟล์');if(f.some(x=>x.size>10*1024*1024))return toast('มีไฟล์ขนาดเกิน 10 MB');lockForm(e,true,'กำลังอัปโหลด…');const files=await Promise.all(f.map(x=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:x.name,mimeType:x.type,base64:r.result});r.onerror=reject;r.readAsDataURL(x)})));const r=await call('uploadFiles',{Opportunity_ID:id,Category:e.target.Category.value,files});if(!r.success){lockForm(e,false);return toast(r.message)}closeModal();toast(r.message,true);detail(id)}
async function customers(){loading();nav('customers');const r=await call('listCustomers','');if(!r.success)return toast(r.message);state.customers=r.data;$('#app').innerHTML=renderTop('ลูกค้า',`${r.data.length} รายการ`)+`<section class="space-y-3 p-4"><div class="flex justify-between"><button class="btn btn-primary" onclick="customerForm()">+ เพิ่มลูกค้า</button><input id="csearch" oninput="filterCustomers()" class="field w-48" placeholder="ค้นหาบริษัท"></div><div id="customer-list" class="space-y-2">${renderCustomers(r.data)}</div></section>`}
function renderCustomers(rows){return rows.length?rows.map(c=>`<button onclick="customerForm('${esc(c.Customer_ID)}')" class="card w-full text-left"><b>${esc(c.Company_Name)}</b><p class="mt-1 text-sm text-slate-600">${esc(c.Contact_Name||'-')} · ${esc(c.Phone||'-')}</p></button>`).join(''):'<div class="card text-center text-slate-500">ไม่พบลูกค้า</div>'}
function filterCustomers(){const q=$('#csearch').value.toLowerCase();$('#customer-list').innerHTML=renderCustomers(state.customers.filter(c=>[c.Company_Name,c.Contact_Name,c.Phone,c.Email].join(' ').toLowerCase().includes(q)))}
async function customerForm(id=''){let c={};if(id){const r=await call('getCustomer',id);if(!r.success)return toast(r.message);c=r.data||{}}modal(`<form class="space-y-3" onsubmit="saveCustomerForm(event,'${esc(id)}')"><div class="flex justify-between"><h2 class="text-lg font-bold">${id?'แก้ไขลูกค้า':'เพิ่มลูกค้า'}</h2><button type="button" onclick="closeModal()">✕</button></div>${input('Company_Name','บริษัท',c.Company_Name,'text',true)}${input('Contact_Name','ผู้ติดต่อ',c.Contact_Name)}${input('Department','แผนก',c.Department)}${input('Phone','เบอร์โทรศัพท์',c.Phone,'tel')}${input('Email','Email',c.Email,'email')}<label><span class="label">ที่อยู่</span><textarea name="Address" class="field">${esc(c.Address||'')}</textarea></label>${input('Map_URL','Google Maps URL',c.Map_URL,'url')}<label><span class="label">หมายเหตุ</span><textarea name="Remark" class="field">${esc(c.Remark||'')}</textarea></label><button class="btn btn-primary w-full">บันทึก</button></form>`)}
async function saveCustomerForm(e,id){e.preventDefault();lockForm(e,true);const x=Object.fromEntries(new FormData(e.target));if(id)x.Customer_ID=id;const r=await call('saveCustomer',x);if(!r.success){lockForm(e,false);return toast(r.message)}await loadCustomers();closeModal();toast(r.message,true);customers()}
const isAdmin=()=>state.user?.Role==='Admin';
const voidStatus=()=>state.voidStatus||'ยกเลิก';
function canEditOpp(o){return isAdmin()||o.Owner===myName()||o.Created_By===myName()}
const money=n=>Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:0});
const kpi=(label,value,tone='')=>`<div class="card"><div class="text-xs text-slate-600">${label}</div><div class="mt-1 text-2xl font-bold ${tone||'text-teal-700'}">${value}</div></div>`;
async function reportPage(f){nav('dashboard');loading();const y=new Date().getFullYear();f=f||{from:y+'-01-01',to:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),owner:state.mine?myName():''};const r=await call('reportSummary',f);if(!r.success)return toast(r.message);const d=r.data;$('#app').innerHTML=renderTop('รายงานสรุป','อัตราการปิดงานและ Pipeline')+`<section class="space-y-4 p-4"><div class="card grid grid-cols-2 gap-2"><label><span class="label">ตั้งแต่</span><input id="rfrom" type="date" value="${esc(f.from)}" class="field"></label><label><span class="label">ถึง</span><input id="rto" type="date" value="${esc(f.to)}" class="field"></label><label class="col-span-2"><span class="label">ผู้รับผิดชอบ</span><select id="rowner" class="field"><option value="">ทั้งทีม</option>${owners().map(s=>`<option ${f.owner===s?'selected':''}>${esc(s)}</option>`).join('')}</select></label><button class="btn btn-primary col-span-2" onclick="runReport()">ดูรายงาน</button></div><div class="grid grid-cols-2 gap-3 sm:grid-cols-4">${kpi('งานทั้งหมด',d.total)}${kpi('อัตราการปิดงาน',d.winRate+'%','text-emerald-600')}${kpi('ได้งาน (บาท)',money(d.wonValue),'text-emerald-600')}${kpi('Pipeline คงค้าง (บาท)',money(d.pipeline),'text-amber-600')}${kpi('กำลังดำเนินการ',d.open)}${kpi('ได้งาน',d.won,'text-emerald-600')}${kpi('ไม่ได้งาน',d.lost,'text-rose-600')}${kpi('ปิดแล้วทั้งหมด',d.won+d.lost)}</div><section><h2 class="mb-2 font-bold">รายคน</h2><div class="card overflow-x-auto p-0"><table class="w-full text-sm"><thead class="bg-slate-100 text-xs text-slate-600"><tr><th class="p-2 text-left">ผู้รับผิดชอบ</th><th class="p-2">ทั้งหมด</th><th class="p-2">ค้าง</th><th class="p-2">ได้</th><th class="p-2">เสีย</th><th class="p-2 text-right">มูลค่าที่ได้</th></tr></thead><tbody>${d.byOwner.length?d.byOwner.map(x=>`<tr class="border-t"><td class="p-2">${esc(x.owner)}</td><td class="p-2 text-center">${x.total}</td><td class="p-2 text-center">${x.open}</td><td class="p-2 text-center font-bold text-emerald-600">${x.won}</td><td class="p-2 text-center text-rose-600">${x.lost}</td><td class="p-2 text-right">${money(x.wonValue)}</td></tr>`).join(''):'<tr><td colspan="6" class="p-4 text-center text-slate-500">ไม่มีข้อมูลในช่วงนี้</td></tr>'}</tbody></table></div></section><section><h2 class="mb-2 font-bold">สาเหตุที่ไม่ได้งาน</h2><div class="space-y-2">${d.lostReasons.length?d.lostReasons.map(x=>`<div class="card flex justify-between py-2 text-sm"><span>${esc(x.reason)}</span><b class="text-rose-600">${x.count}</b></div>`).join(''):'<div class="card text-sm text-slate-500">ยังไม่มีข้อมูล</div>'}</div></section><section><h2 class="mb-2 font-bold">งานที่ได้ล่าสุด</h2><div class="space-y-2">${d.recentWon.length?d.recentWon.map(x=>`<div class="card text-sm"><div class="flex justify-between gap-2"><b>${esc(x.Project_Name)}</b><span class="text-emerald-600">${money(x.Amount)}</span></div><p class="mt-1 text-xs text-slate-500">${esc(x.Company_Name)} · ${esc(x.Owner)}</p></div>`).join(''):'<div class="card text-sm text-slate-500">ยังไม่มีงานที่ปิดได้</div>'}</div></section>${state.sheetUrl?`<a href="${esc(state.sheetUrl)}" target="_blank" rel="noopener" class="btn btn-secondary block text-center">เปิดชีตข้อมูลดิบ (สำหรับ Export / Pivot)</a>`:''}</section>`}
function runReport(){reportPage({from:$('#rfrom').value,to:$('#rto').value,owner:$('#rowner').value})}
function canManageFile(a){return isAdmin()||a.Uploaded_By===myName()}
function voidForm(id){modal(`<form class="space-y-3" onsubmit="submitVoid(event,'${esc(id)}')"><div class="flex justify-between"><h2 class="text-lg font-bold text-rose-700">ยกเลิกงาน</h2><button type="button" onclick="closeModal()">✕</button></div><p class="text-sm text-slate-600">งานจะถูกทำเครื่องหมายว่ายกเลิก ไม่ถูกลบออกจากระบบ และยังค้นหาย้อนหลังได้</p><label><span class="label">เหตุผลที่ยกเลิก *</span><textarea name="Reason" required class="field" rows="3"></textarea></label><button class="btn w-full bg-rose-600 text-white">ยืนยันยกเลิกงาน</button></form>`)}
async function submitVoid(e,id){e.preventDefault();lockForm(e,true,'กำลังยกเลิก…');const r=await call('voidOpportunity',Object.assign({Opportunity_ID:id},Object.fromEntries(new FormData(e.target))));if(!r.success){lockForm(e,false);return toast(r.message)}closeModal();toast(r.message,true);detail(id)}
async function removeFile(id,oppId){if(!confirm('ลบไฟล์นี้หรือไม่? ไฟล์จะถูกย้ายไปถังขยะใน Drive'))return;const r=await call('deleteAttachment',id);if(!r.success)return toast(r.message);toast(r.message,true);detail(oppId)}
async function usersPage(){loading();nav('users');const r=await call('listAllUsers');if(!r.success)return toast(r.message);state.allUsers=r.data;$('#app').innerHTML=renderTop('ผู้ใช้งาน',`${r.data.length} คน`)+`<section class="space-y-3 p-4"><button class="btn btn-primary w-full" onclick="userForm()">+ เพิ่มผู้ใช้</button><div class="space-y-2">${r.data.map(u=>`<button onclick="userForm('${esc(u.User_ID)}')" class="card w-full text-left"><div class="flex justify-between gap-2"><b>${esc(u.Name||u.Email)}</b><span class="badge ${u.Status==='Active'?'bg-emerald-100 text-emerald-700':'bg-slate-200 text-slate-500'}">${esc(u.Status)}</span></div><p class="mt-1 text-sm text-slate-600">${esc(u.Email)} · ${esc(u.Role)}</p></button>`).join('')}</div></section>`}
function userForm(id=''){const u=(state.allUsers||[]).find(x=>x.User_ID===id)||{};modal(`<form class="space-y-3" onsubmit="saveUserForm(event,'${esc(id)}')"><div class="flex justify-between"><h2 class="text-lg font-bold">${id?'แก้ไขผู้ใช้':'เพิ่มผู้ใช้'}</h2><button type="button" onclick="closeModal()">✕</button></div>${input('Name','ชื่อ-นามสกุล',u.Name,'text',true)}${input('Email','อีเมล Google',u.Email,'email',true)}${select('Role','สิทธิ์การใช้งาน',state.roles||['Admin','Sales'],u.Role||'Sales',true)}${select('Status','สถานะ',state.userStatus||['Active','Inactive'],u.Status||'Active',true)}<p class="text-xs text-slate-500">อีเมลต้องตรงกับบัญชี Google ที่พนักงานใช้เปิดระบบ หากตั้งสถานะ Inactive ผู้ใช้จะเข้าระบบไม่ได้ทันที</p><button class="btn btn-primary w-full">บันทึก</button></form>`)}
async function saveUserForm(e,id){e.preventDefault();lockForm(e,true);const x=Object.fromEntries(new FormData(e.target));if(id)x.User_ID=id;const r=await call('saveUser',x);if(!r.success){lockForm(e,false);return toast(r.message)}await loadUsers();closeModal();toast(r.message,true);usersPage()}
start();
function input(name,label,value='',type='text',required=false){let v=value||'';if(type==='date')v=String(v).slice(0,10);if(type==='datetime-local')v=String(v).slice(0,16);return `<label><span class="label">${label}${required?' *':''}</span><input name="${name}" type="${type}" value="${esc(v)}" class="field" ${required?'required':''}></label>`}
  </script>
</body>
</html>
