<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#0f766e">
  <title>PTS Sales</title>

  <!-- ไอคอนแท็บเบราว์เซอร์ -->
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
  <!-- ไอคอนหน้าจอโฮมของ iPhone / iPad -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- ไอคอนหน้าจอโฮมของ Android + ตั้งค่าให้เปิดแบบแอป -->
  <link rel="manifest" href="manifest.webmanifest">

  <meta name="application-name" content="PTS Sales">
  <meta name="apple-mobile-web-app-title" content="PTS Sales">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!--
    เริ่มจับมือกับเซิร์ฟเวอร์ Apps Script ตั้งแต่ตอนที่ยังอ่านไฟล์ HTML อยู่
    ทำให้ตอนยิงคำขอจริงไม่ต้องเสียเวลา DNS + TLS ใหม่ (ประหยัดได้ราว 200-400 ms บนมือถือ)
  -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>

  <!-- ฟอนต์โหลดแบบไม่บล็อกการวาดหน้าจอ (display=swap) ระหว่างรอจะใช้ฟอนต์ระบบไปก่อน -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app">
    <div class="splash">
      <img src="logo-mark.png" alt="PAKORN Technical Supply" width="72" height="72" style="height:72px;width:auto">
      <div class="spinner"></div>
      <p>กำลังเปิด PTS Sales…</p>
    </div>
  </main>

  <nav id="nav" class="nav" hidden></nav>
  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
